c_compiler:
- gcc
c_compiler_version:
- '15'
c_stdlib:
- sysroot
c_stdlib_version:
- '2.39'
channel_sources:
- conda-forge
channel_targets:
- conda-forge main
docker_image:
- quay.io/condaforge/linux-anvil-riscv64:rocky10
is_abi3:
- true
is_python_min:
- true
pin_run_as_build:
