{% set version = "0.8.3" %}

package:
  name: wcwidth
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/w/wcwidth/wcwidth-{{ version }}.tar.gz
  sha256: d128512515fbf4612e0ff21fd6380399210318b7b54a9af59dff8454cf9730eb

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}

test:
  imports:
    - wcwidth
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/jquast/wcwidth
  license: MIT
  license_file: LICENSE
  summary: Measures number of Terminal column cells of wide-character codes.

extra:
  recipe-maintainers:
    - ocefpaf
