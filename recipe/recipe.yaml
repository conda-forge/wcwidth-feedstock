schema_version: 1

context:
  version: "0.9.1"

package:
  name: wcwidth
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/w/wcwidth/wcwidth-${{ version }}.tar.gz
  sha256: 5823209b0d43af322ce698c689380d7c15ca31fa8e6e3be8459f27031bef0af5

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - wcwidth
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Measures the displayed width of unicode strings in a terminal
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/jquast/wcwidth

extra:
  recipe-maintainers:
    - ocefpaf
